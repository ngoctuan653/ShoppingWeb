<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body style="padding-top: 50px;">
    <div th:replace="~{fragments/header-navbar :: navbar}"></div>
    <div class="container my-5">
        <h2 class="fw-bold text-center mb-4">Order Details</h2>
        <div class="card mb-4">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0">Order ID: <span th:text="${order.id}"></span></h5>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <p><strong>Order Date:</strong> <span th:text="${#dates.format(order.orderDate, 'dd/MM/yyyy HH:mm')} ?: 'N/A'"></span></p>
                        <p><strong>Total Amount:</strong> <span th:text="${#numbers.formatDecimal(order.totalAmount, 2, 'POINT', 0, 'COMMA')} + ' $' ?: 'N/A'"></span></p>
                        <p><strong>Status:</strong> <span th:text="${order.status.statusName} ?: 'N/A'"></span></p>
						<p><strong>Discount Code:</strong> <span th:text="${order.discount?.code} ?: 'None'"></span></p>
                    </div>
                    <div class="col-md-6">
                        <p><strong>Customer Name:</strong> <span th:text="${order.user.fullName} ?: 'N/A'"></span></p>
                        <p><strong>Shipping Address:</strong> <span th:text="${order.shippingAddress} ?: 'N/A'"></span></p>
                        <p><strong>Phone Number:</strong> <span th:text="${order.phoneNumber} ?: 'N/A'"></span></p>
                    </div>
                </div>
            </div>
        </div>
        <h4 class="mb-3">Products</h4>
        <div class="table-responsive">
            <table class="table table-bordered align-middle">
                <thead class="table-dark text-center">
                    <tr>
                        <th>Product Name</th>
                        <th>Size</th>
                        <th>Quantity</th>
                        <th>Unit Price</th>
                        <th>Subtotal</th>
                    </tr>
                </thead>
                <tbody class="text-center">
                    <tr th:each="detail : ${orderDetails}">
                        <td th:text="${detail.product.productName} ?: 'N/A'"></td>
                        <td th:text="${detail.size.sizeLabel} ?: 'N/A'"></td>
                        <td th:text="${detail.quantity} ?: 'N/A'"></td>
                        <td th:text="${#numbers.formatDecimal(detail.unitPrice, 2, 'POINT', 0, 'COMMA')} + ' $' ?: 'N/A'"></td>
                        <td>
                            <span th:if="${detail.quantity != null and detail.unitPrice != null}"
                                  th:text="${#numbers.formatDecimal(detail.unitPrice.multiply(T(java.math.BigDecimal).valueOf(detail.quantity.longValue())), 2, 'POINT', 0, 'COMMA')} + ' $'">
                            </span>
                            <span th:unless="${detail.quantity != null and detail.unitPrice != null}">N/A</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="text-center mt-4">
            <a th:href="@{/order/history}" class="btn btn-primary me-2">Back to Order History</a>
            <a th:href="@{/orders/delete/{id}(id=${order.id})}" class="btn btn-danger">Delete Order</a>
        </div>
    </div>
    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
