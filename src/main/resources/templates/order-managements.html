<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Managements</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="bg-light">

<!-- Navbar -->
<div th:replace="fragments/admin-header-navbar :: navbar"></div>

<!-- Sidebar + Main -->
<div class="d-flex">
    <!-- Sidebar -->
    <div th:replace="fragments/admin-sidebar :: sidebar"></div>

    <!-- Main Content -->
	<div id="mainContent" class="main-content flex-grow-1 p-4">
        <div>
            <h2 class="fw-bold mb-0">Order Management</h2>
            <p class="text-muted">Manage your store's orders</p>
        </div>

        <table class="table table-bordered table-hover align-middle text-center mt-3">
            <thead class="table-dark">
            <tr>
                <th>Order ID</th>
                <th>Customer</th>
                <th>Date</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="order : ${orders}">
                <td th:text="${order.displayCode}">#1024</td>
                <td th:text="${order.user.fullName}">John Doe</td>
                <td th:text="${#dates.format(order.orderDate, 'dd/MM/yyyy ''at'' HH:mm')}">2025-07-20</td>
                <td>
                    <span th:text="${order.status.statusName}" class="badge bg-warning text-dark">Pending</span>
                </td>
                <td>
                    <button class="btn btn-sm btn-dark" data-bs-toggle="modal" data-bs-target="#confirmModal"
                            th:attr="onclick=|loadOrderDetails(${order.id})|">
                        <i class="bi bi-pencil"></i>
                    </button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Confirm Modal -->
<div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Confirm Order</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p><strong>Order ID:</strong> <span id="orderId">...</span></p>
                <p><strong>Customer:</strong> <span id="customerName">...</span></p>
                <p><strong>Shipping Address:</strong> <span id="shippingAddress">...</span></p>
                <p><strong>Phone Number:</strong> <span id="phoneNumber">...</span></p>
                <p><strong>Items:</strong></p>
                <ul id="orderItemsList"></ul>
                <p id="discountRow" style="display: none;">
                    <strong>Discount:</strong> <span id="discount">...</span>
                </p>
                <p><strong>Total:</strong> $<span id="orderTotal">...</span></p>
                <p><strong>Status:</strong>
                    <select id="orderStatusSelect" class="form-select form-select-sm w-auto d-inline-block ms-2">
                        <!-- Options populated dynamically -->
                    </select>
                </p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-success" id="confirmOrderBtn">Save</button>
            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin.js}"></script>
<script>
    let selectedOrderId = null;

    async function loadOrderDetails(orderId) {
        selectedOrderId = orderId;
        try {
            const response = await fetch(`/api/order/${orderId}/details`);
            if (!response.ok) throw new Error("Order not found");
            const data = await response.json();

            document.getElementById("orderId").textContent = data.orderId;
            document.getElementById("customerName").textContent = data.customer;
            document.getElementById("shippingAddress").textContent = data.shippingAddress;
            document.getElementById("phoneNumber").textContent = data.phoneNumber;
            document.getElementById("orderTotal").textContent = data.total.toFixed(2);

            if (data.discount) {
                document.getElementById("discountRow").style.display = "block";
                document.getElementById("discount").textContent = data.discount;
            } else {
                document.getElementById("discountRow").style.display = "none";
                document.getElementById("discount").textContent = "";
            }

            const itemsList = document.getElementById("orderItemsList");
            itemsList.innerHTML = "";
            data.items.forEach(item => {
                const li = document.createElement("li");
                li.textContent = `${item.productName} (Size: ${item.size}) x${item.quantity} - $${item.unitPrice.toFixed(2)}`;
                itemsList.appendChild(li);
            });

            const statusSelect = document.getElementById("orderStatusSelect");
            const statusResponse = await fetch("/order/statuses");
            const statuses = await statusResponse.json();
            statusSelect.innerHTML = "";

            statuses.forEach(status => {
                const option = document.createElement("option");
                option.value = status;
                option.textContent = status;
                if (status.toLowerCase() === data.status?.toLowerCase()) {
                    option.selected = true;
                }
                statusSelect.appendChild(option);
            });

        } catch (err) {
            console.error("Failed to load order details:", err);
            showAlert("error", "Could not load order details.");
        }
    }

    document.getElementById("confirmOrderBtn").addEventListener("click", async () => {
        if (!selectedOrderId) return;
        const newStatus = document.getElementById("orderStatusSelect").value;

        try {
            const response = await fetch(`/order/${selectedOrderId}/status`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ status: newStatus })
            });

            const result = await response.json();

            if (response.ok) {
                showAlert('success', result.message);
                const modalEl = document.getElementById("confirmModal");
                const modal = bootstrap.Modal.getInstance(modalEl);
                modal.hide();
                setTimeout(() => location.reload(), 1000);
            } else {
                showAlert('error', result.message);
            }
        } catch (err) {
            console.error("Error confirming order:", err);
            alert("Something went wrong!");
        }
    });

    function showAlert(type, message) {
        Swal.fire({
            icon: type,
            title: message,
            showConfirmButton: false,
            timer: 3000,
            toast: true,
            position: 'top'
        });
    }
</script>

</body>
</html>
