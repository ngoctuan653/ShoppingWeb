<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Order history</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body style="padding-top: 50px;">
    <!-- Navbar fragment -->
    <div th:replace="fragments/header-navbar :: navbar"></div>

    <div class="container my-5">
        <h2 class="fw-bold text-center mb-4">Order history</h2>

        <div class="mb-4 text-center">
            <input type="text" class="form-control w-50 d-inline-block me-2" placeholder="Tìm theo mã đơn hàng hoặc sản phẩm...">
            <button class="btn btn-dark">Search</button>
        </div>

        <div class="table-responsive">
            <table class="table table-bordered align-middle">
                <thead class="table-dark text-center">
                    <tr>
                        <th>ID</th>
                        <th>Date</th>
                        <th>Total</th>
                        <th>Status</th>
                        <th>Details</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody class="text-center">
                    <tr th:each="orderDTO : ${orders}">
                        <td th:text="${orderDTO.order.displayCode}">OD00000023</td>
                        <td th:text="${#dates.format(orderDTO.order.orderDate, 'dd/MM/yyyy HH:mm')}">01/01/2025</td>
                        <td th:text="${#numbers.formatDecimal(orderDTO.order.totalAmount, 0, 'POINT', 0, 'COMMA')} + ' $'">100000 $</td>
                        <td>
                            <span class="badge bg-success" th:if="${orderDTO.order.status.statusName == 'Đã giao'}"
                                  th:text="${orderDTO.order.status.statusName}"></span>
                            <span class="badge bg-warning text-dark" th:if="${orderDTO.order.status.statusName == 'Đang xử lý'}"
                                  th:text="${orderDTO.order.status.statusName}"></span>
                            <span class="badge bg-secondary"
                                  th:if="${orderDTO.order.status.statusName != 'Đã giao' and orderDTO.order.status.statusName != 'Đang xử lý'}"
                                  th:text="${orderDTO.order.status.statusName}"></span>
                        </td>
                        <td>
                            <ul class="list-unstyled mb-0" th:each="detail : ${orderDetailsMap[orderDTO.order.id]}">
                                <li>
                                    <span th:text="${detail.product.productName}">Áo thun</span>
                                    (<span th:text="${detail.size.sizeLabel}">M</span>) x
                                    <span th:text="${detail.quantity}">2</span>
                                </li>
                            </ul>
                        </td>
                        <td>
                            <a th:href="@{/order/detail/{id}(id=${orderDTO.order.id})}" class="btn btn-primary btn-sm me-1">
                                <i class="bi bi-eye"></i> Details
                            </a>
                            <a th:href="@{/orders/delete/{id}(id=${orderDTO.order.id})}" class="btn btn-danger btn-sm">
                                <i class="bi bi-trash"></i> Delete
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Footer fragment -->
    <div th:replace="fragments/footer :: footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
