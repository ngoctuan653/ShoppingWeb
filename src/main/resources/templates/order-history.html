<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order History - StyleLegacy</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body style="padding-top: 100px;">
<!-- Navigation Bar -->
<div th:replace="fragments/header-navbar :: navbar"></div>

<section class="py-5">
    <div class="container">
        <div class="row">
            <div class="col-12">
                <div class="card shadow">
                    <div class="card-header bg-white">
                        <h5 class="mb-0 fw-bold">Order History</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-bordered align-middle text-center">
                                <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Date</th>
                                    <th>Total</th>
                                    <th>Status</th>
                                    <th>Detail</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="orderDTO : ${orders}">
                                    <td th:text="${orderDTO.order.displayCode}">OD00000023</td>
                                    <td th:text="${#dates.format(orderDTO.order.orderDate, 'dd/MM/yyyy HH:mm')}">
                                        01/01/2025
                                    </td>
                                    <td th:text="${#numbers.formatDecimal(orderDTO.order.totalAmount, 0, 'POINT', 0, 'COMMA')} + ' $'">
                                        100000
                                    </td>
                                    <td th:text="${orderDTO.order.status.statusName}">Delivered</td>
                                    <td>
                                        <a th:href="@{/order/detail/{id}(id=${orderDTO.order.id})}" class="btn btn-sm btn-outline-dark">
                                            <i class="bi bi-eye"></i> View
                                        </a>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>

                        <!-- Optional: Uncomment to show product details inline -->
                        <!--
                        <tr th:each="orderDTO : ${orders}">
                            <td colspan="5">
                                <table class="table table-sm table-bordered mb-0">
                                    <thead>
                                    <tr>
                                        <th>Product</th>
                                        <th>Size</th>
                                        <th>Quantity</th>
                                        <th>Unit Price</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="detail : ${orderDetailsMap[orderDTO.order.id]}">
                                        <td th:text="${detail.product.productName}">T-shirt</td>
                                        <td th:text="${detail.size.sizeLabel}">M</td>
                                        <td th:text="${detail.quantity}">2</td>
                                        <td th:text="${#numbers.formatDecimal(detail.unitPrice, 2, 'POINT', 0, 'COMMA')} + ' $'">49.99</td>
                                    </tr>
                                    </tbody>
                                </table>
                            </td>
                        </tr>
                        -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Footer -->
<div th:replace="fragments/footer :: footer"></div>
<div th:replace="fragments/cart :: cart"></div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Custom JS -->
<script src="/js/script.js"></script>
</body>
</html>
