<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - StyleLegacy</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>

<!-- Navigation Bar -->
<div th:replace="fragments/header-navbar :: navbar"></div>

<!-- Checkout Section -->
<div class="container my-5">
    <div class="row">
        <div class="col-lg-8 mb-4">
            <h2 class="fw-bold mb-4">Your Cart</h2>

            <!-- Cart Items -->
            <div class="row">
                <div class="col-md-4 mb-4">
                    <div class="card">
                        <img th:src="@{'https://noithatbinhminh.com.vn/wp-content/uploads/2022/08/anh-dep-44.jpg.webp'}"
                             class="card-img-top" alt="Product Image">
                        <div class="card-body">
                            <h5 class="card-title">Slim Fit Jeans</h5>
                            <p class="card-text text-muted">High-quality slim fit jeans for a trendy look.</p>
                            <p class="fw-bold">$49.99</p>
                            <div class="d-flex justify-content-between">
                                <button class="btn btn-outline-secondary btn-sm">-</button>
                                <span class="px-2">1</span>
                                <button class="btn btn-outline-secondary btn-sm">+</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-md-4 mb-4">
                    <div class="card">
                        <img th:src="@{'https://noithatbinhminh.com.vn/wp-content/uploads/2022/08/anh-dep-44.jpg.webp'}"
                             class="card-img-top" alt="Product Image">
                        <div class="card-body">
                            <h5 class="card-title">Casual T-shirt</h5>
                            <p class="card-text text-muted">Comfortable cotton T-shirt with a cool graphic design.
                            </p>
                            <p class="fw-bold">$29.99</p>
                            <div class="d-flex justify-content-between">
                                <button class="btn btn-outline-secondary btn-sm">-</button>
                                <span class="px-2">2</span>
                                <button class="btn btn-outline-secondary btn-sm">+</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-md-4 mb-4">
                    <div class="card">
                        <img th:src="@{'https://noithatbinhminh.com.vn/wp-content/uploads/2022/08/anh-dep-44.jpg.webp'}"
                             class="card-img-top" alt="Product Image">
                        <div class="card-body">
                            <h5 class="card-title">Leather Jacket</h5>
                            <p class="card-text text-muted">Genuine leather jacket for a stylish and bold look.</p>
                            <p class="fw-bold">$119.99</p>
                            <div class="d-flex justify-content-between">
                                <button class="btn btn-outline-secondary btn-sm">-</button>
                                <span class="px-2">1</span>
                                <button class="btn btn-outline-secondary btn-sm">+</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <hr>

            <!-- Cart Total -->
            <div class="d-flex justify-content-between mb-4">
                <h5>Total: </h5>
                <h5>$219.97</h5>
            </div>

        </div>

        <!-- Billing Info -->
        <div class="col-lg-4 mb-4">
            <h2 class="fw-bold mb-4">Billing Information</h2>
            <form action="/process_order" method="POST">
                <div class="mb-3">
                    <label for="name" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="name" name="name" required>
                </div>
                <div class="mb-3">
                    <label for="address" class="form-label">Shipping Address</label>
                    <textarea class="form-control" id="address" name="address" required></textarea>
                </div>
                <div class="mb-3">
                    <label for="payment" class="form-label">Payment Method</label>
                    <select class="form-select" id="payment" name="payment" required>
                        <option value="credit-card">Credit Card</option>
                        <option value="paypal">PayPal</option>
                        <option value="bank-transfer">Bank Transfer</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-dark w-100">Complete Purchase</button>
            </form>
        </div>
    </div>
</div>

<!-- Footer -->
<div th:replace="fragments/footer :: footer"></div>
<div th:replace="fragments/cart :: cart"></div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/script.js"></script>
</body>

</html>
