<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - StyleLegacy</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body style="padding-top: 50px;">

<!-- Navigation Bar -->
<div th:replace="fragments/header-navbar :: navbar"></div>

<!-- Checkout Section -->
<div class="container my-5">
    <div class="row">
        <div class="col-lg-8 mb-4">
            <h2 class="fw-bold mb-4">Your Cart</h2>

            <!-- Cart Items -->
            <div class="row" id="checkout-cart-items">
                <div class="col-md-4 mb-4">
                    <div class="card">
                        <img th:src="@{'https://noithatbinhminh.com.vn/wp-content/uploads/2022/08/anh-dep-44.jpg.webp'}"
                             class="card-img-top" alt="Product Image">
                        <div class="card-body">
                            <h5 class="card-title">Slim Fit Jeans</h5>
                            <p class="card-text text-muted">High-quality slim fit jeans for a trendy look.</p>

                            <!-- Size Selection -->
                            <div class="mb-2">
                                <label for="sizeSelect" class="form-label mb-0">Size:</label>
                                <select class="form-select form-select-sm" id="sizeSelect">
                                    <option value="S">S</option>
                                    <option value="M" selected>M</option>
                                    <option value="L">L</option>
                                    <option value="XL">XL</option>
                                </select>
                            </div>

                            <!-- Price -->
                            <p class="fw-bold">$49.99</p>

                            <!-- Quantity -->
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <div class="d-flex align-items-center">
                                    <button class="btn btn-outline-secondary btn-sm">-</button>
                                    <span class="px-2">1</span>
                                    <button class="btn btn-outline-secondary btn-sm">+</button>
                                </div>
                                <!-- Remove Button -->
                                <button class="btn btn-sm btn-danger">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <hr>

        </div>

        <!-- Billing Info -->
        <div class="col-lg-4 mb-4">
            <h2 class="fw-bold mb-4">Billing Information</h2>
            <form th:action="@{/cart/checkout}" method="POST">
                <!--                <div class="mb-3">-->
                <!--                    <label for="name" class="form-label">Full Name</label>-->
                <!--                    <input type="text" class="form-control" id="name" name="name" required>-->
                <!--                </div>-->
                <div class="mb-3">
                    <label for="shippingAddress" class="form-label">Shipping Address:</label>
                    <textarea class="form-control" name="shippingAddress" id="shippingAddress" required></textarea>
                </div>
                <div class="mb-3">
                    <label for="phone" class="form-label">Phone Number:</label>
                    <input type="text" class="form-control" name="phone" id="phone" required>
                </div>
                <!--                <div class="mb-3">-->
                <!--                    <label for="payment" class="form-label">Payment Method</label>-->
                <!--                    <select class="form-select" id="payment" name="payment" required>-->
                <!--                        <option value="credit-card">Credit Card</option>-->
                <!--                        <option value="paypal">PayPal</option>-->
                <!--                        <option value="bank-transfer">Bank Transfer</option>-->
                <!--                    </select>-->
                <!--                </div>-->

                <!-- Cart Total -->
                <input type="hidden" name="discountCode" id="discountCodeHidden">
                <div class="d-flex justify-content-between mb-4">
                    <h5>Total: </h5>
                    <h5 id="checkout-cart-total">$0.00</h5>
                    <input type="hidden" id="cartTotalValue" value="0">
                </div>

                <!-- Discount Code -->
                <div class="mb-3">
                    <label for="discountCode" class="form-label">Discount Code</label>
                    <div class="input-group">
                        <input type="text" id="discountCode" class="form-control" placeholder="Enter discount code">
                        <button class="btn btn-outline-secondary" type="button" id="applyDiscount">Apply</button>
                    </div>
                    <div id="discountFeedback" class="form-text text-success"></div>
                </div>

                <!-- Discount Amount and New Total -->
                <div class="d-flex justify-content-between mb-2" id="discountRow" style="display: none;">
                    <span>Discount:</span>
                    <span id="discountAmount">- $0.00</span>
                </div>
                <div class="d-flex justify-content-between mb-4" id="finalTotalRow" style="display: none;">
                    <span>New Total:</span>
                    <span id="finalTotal">$0.00</span>
                </div>

                <button type="submit" class="btn btn-dark w-100">Complete Purchase</button>
            </form>



        </div>
    </div>
</div>

<!-- Footer -->
<div th:replace="fragments/footer :: footer"></div>
<div th:replace="fragments/cart :: cart"></div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/script.js"></script>
<script>
    document.getElementById("applyDiscount").addEventListener("click", function () {
        const code = document.getElementById("discountCode").value.trim().toUpperCase();
        const feedback = document.getElementById("discountFeedback");
        const discountRow = document.getElementById("discountRow");
        const finalTotalRow = document.getElementById("finalTotalRow");
        const discountAmountEl = document.getElementById("discountAmount");
        const finalTotalEl = document.getElementById("finalTotal");
        const hiddenInput = document.getElementById("discountCodeHidden");

        if (!code) {
            feedback.textContent = "Please enter a discount code.";
            feedback.className = "form-text text-danger";
            return;
        }

        fetch(`/api/discounts/validate?code=${code}`)
            .then(res => {
                if (!res.ok) throw new Error("Invalid code");
                return res.json();
            })
            .then(data => {
                const percentage = parseFloat(data.percentage);
                const cartTotal = parseFloat(document.getElementById("cartTotalValue").value);
                const discountValue = cartTotal * (percentage / 100);
                const newTotal = Math.max(0, cartTotal - discountValue);

                discountAmountEl.textContent = `- $${discountValue.toFixed(2)}`;
                finalTotalEl.textContent = `$${newTotal.toFixed(2)}`;
                discountRow.style.display = "flex";
                finalTotalRow.style.display = "flex";

                feedback.textContent = `✓ Code "${code}" applied (${percentage}% off)`;
                feedback.className = "form-text text-success";

                hiddenInput.value = code; // để gửi về backend khi submit
            })
            .catch(() => {
                discountRow.style.display = "none";
                finalTotalRow.style.display = "none";
                feedback.textContent = "❌ Invalid discount code";
                feedback.className = "form-text text-danger";
                hiddenInput.value = "";
            });
    });

    document.addEventListener("DOMContentLoaded", () => {
        loadCheckoutCart();
    });
</script>


</body>

</html>
