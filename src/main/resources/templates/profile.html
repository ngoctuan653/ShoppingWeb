<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>User Profile - StyleLegacy</title>

	<!-- Bootstrap 5 CSS -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<!-- Bootstrap Icons -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
	<!-- Custom CSS -->
	<link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<!-- Navigation Bar -->
<div th:replace="fragments/header-navbar :: navbar"></div>

<!-- User Profile Section -->
<div class="container my-5" style="padding-top: 50px">
	<div class="row">
		<form id="profile-update-form" th:action="@{/update_profile}" method="POST" enctype="multipart/form-data" class="row">

			<!-- Left: User Avatar and Upload -->
			<div class="col-lg-3 mb-4 text-center">
				<img th:if="${user.avatar != null}" id="user-avatar" th:src="@{'/avatar/' + ${user.id}}"
					 alt="User Avatar" class="rounded-circle mb-3"
					 style="width: 270px; height: 270px; object-fit: cover; border: 1px solid black;">

				<img th:if="${user.avatar == null}" th:src="@{/images/default.png}"
					 alt="User Avatar" class="rounded-circle mb-3"
					 style="width: 270px; height: 270px; object-fit: cover; border: 1px solid black;">

				<!-- Avatar Upload -->
				<div class="mb-3">
					<input type="file" class="form-control" id="avatar" name="avatar">
				</div>
			</div>

			<!-- Right: User Profile Form -->
			<div class="col-lg-9 mb-4">
				<h2 class="fw-bold mb-4">Your Profile</h2>

				<!-- Full Name -->
				<div class="mb-3">
					<label for="full_name" class="form-label">Full Name</label>
					<input type="text" class="form-control" id="full_name" name="full_name"
						   th:value="${user.fullName}" required>
				</div>

				<!-- Email -->
				<div class="mb-3">
					<label for="email" class="form-label">Email</label>
					<input type="email" class="form-control" id="email" name="email"
						   th:value="${user.email}" readonly>
				</div>

				<!-- Phone Number -->
				<div class="mb-3">
					<label for="phone_number" class="form-label">Phone Number</label>
					<input type="text" class="form-control" id="phone_number" name="phone_number"
						   th:value="${user.phoneNumber}">
				</div>

				<!-- Address -->
				<div class="mb-3">
					<label for="address" class="form-label">Address</label>
					<textarea class="form-control" id="address" name="address"
							  rows="3" th:text="${user.address}"></textarea>
				</div>

				<!-- Submit Button -->
				<button type="submit" class="btn btn-dark">Save</button>
			</div>
		</form>
	</div>
</div>

<!-- Footer -->
<div th:replace="fragments/footer :: footer"></div>
<div th:replace="fragments/cart :: cart"></div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Custom JS -->
<script>
	// Optional: preview avatar before upload
	document.getElementById("avatar").addEventListener("change", function (e) {
		const file = e.target.files[0];
		if (file) {
			const reader = new FileReader();
			reader.onload = function (event) {
				document.getElementById("user-avatar").src = event.target.result;
			};
			reader.readAsDataURL(file);
		}
	});
</script>
<script src="/js/script.js"></script>

</body>
</html>
