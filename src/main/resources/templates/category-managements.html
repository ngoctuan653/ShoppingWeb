<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Category Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet"/>
  <style>
    .subcategory-row {
      display: none;
    }
    .cursor-pointer {
      cursor: pointer;
    }
    .category-header {
      background-color: #343a40;
      color: white;
    }
  </style>
</head>
<body class="bg-light" style="padding-top: 80px;">
	
	<!-- Navbar -->
	<div th:replace="fragments/admin-header-navbar :: navbar"></div>

<div class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Category Management</h2>
    <button class="btn btn-dark" data-bs-toggle="modal" data-bs-target="#addCategoryModal">
      <i class="bi bi-plus-circle"></i> Add Category
    </button>
  </div>

  <!-- Categories Table -->
  <table class="table table-bordered table-hover">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Category Name</th>
        <th>Description</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <!-- Example Category -->
      <tr class="cursor-pointer" onclick="toggleSubcategories('subcat-1')">
        <td>1</td>
        <td>Men</td>
        <td>All men’s clothing and gear</td>
        <td>
			<button class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" data-bs-target="#editCategoryModal">
			  <i class="bi bi-pencil-square"></i>
			</button>

          <button class="btn btn-sm btn-outline-success" data-bs-toggle="modal" data-bs-target="#addSubcategoryModal">
            <i class="bi bi-plus"></i>
          </button>
          <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
        </td>
      </tr>

      <!-- Subcategories Row -->
      <tr id="subcat-1" class="subcategory-row bg-white">
        <td colspan="4">
          <strong>Subcategories:</strong>
          <table class="table table-sm table-bordered mt-2">
            <thead class="table-dark">
              <tr>
                <th>ID</th>
                <th>Subcategory Name</th>
                <th>Description</th>
                <th>Brand ID</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>1</td>
                <td>Running Shoes</td>
                <td>High-performance running shoes</td>
                <td>101</td>
                <td>
                  <button class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" data-bs-target="#editSubcategoryModal">
                    <i class="bi bi-pencil-square"></i>
                  </button>
                  <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                </td>
              </tr>
              <!-- Add more subcategories here -->
            </tbody>
          </table>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<!-- Add Category Modal -->
<div class="modal fade" id="addCategoryModal" tabindex="-1" aria-labelledby="addCategoryLabel" aria-hidden="true">
  <div class="modal-dialog">
    <form class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Add Category</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label for="categoryName" class="form-label">Category Name</label>
          <input type="text" class="form-control" id="categoryName" required />
        </div>
        <div class="mb-3">
          <label for="categoryDescription" class="form-label">Description</label>
          <textarea class="form-control" id="categoryDescription"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button type="submit" class="btn btn-dark">Save</button>
      </div>
    </form>
  </div>
</div>

<!-- Edit Category Modal -->
<div class="modal fade" id="editCategoryModal" tabindex="-1" aria-labelledby="editCategoryLabel" aria-hidden="true">
  <div class="modal-dialog">
    <form class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Edit Category</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label for="editCategoryName" class="form-label">Category Name</label>
          <input type="text" class="form-control" id="editCategoryName" required />
        </div>
        <div class="mb-3">
          <label for="editCategoryDescription" class="form-label">Description</label>
          <textarea class="form-control" id="editCategoryDescription"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button type="submit" class="btn btn-dark">Update</button>
      </div>
    </form>
  </div>
</div>

<!-- Add Subcategory Modal -->
<div class="modal fade" id="addSubcategoryModal" tabindex="-1" aria-labelledby="addSubcategoryLabel" aria-hidden="true">
  <div class="modal-dialog">
    <form class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Add Subcategory</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label for="subcategoryName" class="form-label">Subcategory Name</label>
          <input type="text" class="form-control" id="subcategoryName" required />
        </div>
        <div class="mb-3">
          <label for="subcategoryDescription" class="form-label">Description</label>
          <textarea class="form-control" id="subcategoryDescription"></textarea>
        </div>
        <div class="mb-3">
          <label for="brandId" class="form-label">Brand ID</label>
          <input type="number" class="form-control" id="brandId" />
        </div>
      </div>
      <div class="modal-footer">
        <button type="submit" class="btn btn-dark">Add Subcategory</button>
      </div>
    </form>
  </div>
</div>

<!-- Edit Subcategory Modal -->
<div class="modal fade" id="editSubcategoryModal" tabindex="-1" aria-labelledby="editSubcategoryLabel" aria-hidden="true">
  <div class="modal-dialog">
    <form class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Edit Subcategory</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label for="editSubcategoryName" class="form-label">Subcategory Name</label>
          <input type="text" class="form-control" id="editSubcategoryName" required />
        </div>
        <div class="mb-3">
          <label for="editSubcategoryDescription" class="form-label">Description</label>
          <textarea class="form-control" id="editSubcategoryDescription"></textarea>
        </div>
        <div class="mb-3">
          <label for="editBrandId" class="form-label">Brand ID</label>
          <input type="number" class="form-control" id="editBrandId" />
        </div>
      </div>
      <div class="modal-footer">
        <button type="submit" class="btn btn-dark">Update Subcategory</button>
      </div>
    </form>
  </div>
</div>

<script>
  function toggleSubcategories(id) {
    const row = document.getElementById(id);
    row.style.display = row.style.display === 'table-row' ? 'none' : 'table-row';
  }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
