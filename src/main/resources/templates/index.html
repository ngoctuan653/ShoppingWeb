<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <title>Thêm Sản Phẩm</title>
</head>
<body>
<h2>Thêm Sản Phẩm</h2>
<form id="productForm" enctype="multipart/form-data">
    <label>Tên sản phẩm:</label><br>
    <input type="text" id="productName" required><br>

    <label>Mô tả:</label><br>
    <textarea id="description"></textarea><br>

    <label>Giá:</label><br>
    <input type="number" id="price" required><br>

    <label>Category ID:</label><br>
    <input type="number" id="categoryId" required><br>

    <label>SubCategory ID:</label><br>
    <input type="number" id="subCategoryId" required><br>

    <label>Brand ID:</label><br>
    <input type="number" id="brandId" required><br>

    <label>Trạng thái:</label><br>
    <select name="status" id="status">
        <option value="Active">Active</option>
        <option value="Inactive">Inactive</option>
    </select><br><br>

    <label>Chọn ảnh sản phẩm:</label><br>
    <input type="file" name="image"><br><br>

    <h3>Sizes</h3>
    <label>Size:</label>
    <input type="text" id="sizeLabel">
    <label>Số lượng:</label>
    <input type="number" id="stockQuantity">
    <button type="button" onclick="addSize()">+ Thêm Size</button>

    <ul id="sizeList"></ul>

    <button type="submit">Gửi</button>
</form>

<script>
    const sizes = [];
    function addSize() {
        const sizeLabel = document.getElementById("sizeLabel").value;
        const stockQuantity = document.getElementById("stockQuantity").value;

        if (sizeLabel && stockQuantity) {
            sizes.push({ sizeLabel, stockQuantity: parseInt(stockQuantity) });

            const li = document.createElement("li");
            li.innerText = `${sizeLabel} - SL: ${stockQuantity}`;
            document.getElementById("sizeList").appendChild(li);

            // Reset input
            document.getElementById("sizeLabel").value = "";
            document.getElementById("stockQuantity").value = "";
        }
    }


    document.getElementById("productForm").addEventListener("submit", function (e) {
        e.preventDefault();

        const form = document.getElementById("productForm");
        const formData = new FormData();

        const product = {
            productName: document.getElementById("productName").value,
            description: document.getElementById("description").value,
            price: parseFloat(document.getElementById("price").value),
            categoryId: parseInt(document.getElementById("categoryId").value),
            subCategoryId: parseInt(document.getElementById("subCategoryId").value),
            brandId: parseInt(document.getElementById("brandId").value),
            status: document.getElementById("status").value,
            sizes: sizes
        };

        formData.append("product", new Blob([JSON.stringify(product)], {
            type: "application/json"
        }));

        const imageInput = form.querySelector("input[name='image']");
        if (imageInput.files.length > 0) {
            formData.append("image", imageInput.files[0]);
        }

        fetch("http://localhost:8080/products/add", {
            method: "POST",
            body: formData
        })
            .then(response => {
                if (!response.ok) throw new Error("Gửi thất bại");
                return response.json();
            })
            .then(result => {
                alert("Thêm sản phẩm thành công!");
                console.log(result);
            })
            .catch(err => {
                alert("Lỗi: " + err.message);
            });
    });

</script>

</body>
</html>
