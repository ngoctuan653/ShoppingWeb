<!-- src/main/resources/templates/admin/user-management.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>User Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/styles.css">
<body>
<div th:replace="fragments/admin-header-navbar :: navbar"></div>

<div class="container my-5" style="padding-top: 40px">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-0">User Management</h2>
            <p class="text-muted">Manage User</p>
        </div>
    </div>

    <form class="mb-3 d-flex" th:action="@{/admin/users}" method="get">
        <input type="text" name="keyword" class="form-control me-2" placeholder="Search by Name or Email...." th:value="${keyword}">
        <button class="btn btn-dark" type="submit">Search</button>
    </form>

    <table class="table table-bordered table-striped align-middle">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Avatar</th>
            <th>FullName</th>
            <th>Email</th>
            <th>Phone Number</th>
            <th>Address</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.id}"></td>
            <td>
                <img th:src="@{/avatar/{id}(id=${user.id})}" width="40" height="40" class="rounded-circle" alt="Avatar">
            </td>
            <td th:text="${user.fullName}"></td>
            <td th:text="${user.email}"></td>
            <td th:text="${user.phoneNumber}"></td>
            <td th:text="${user.address}"></td>
            <td>
                <button class="btn btn-sm btn-primary" data-bs-toggle="modal"
                        th:attr="data-bs-target='#editModal__' + ${user.id}">
                    Edit
                </button>


                <a th:href="@{'/admin/users/delete/' + ${user.id}}" class="btn btn-sm btn-danger"
                   onclick="return confirm('Bạn có chắc chắn muốn xóa người dùng này?');">
                    Delete
                </a>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- Edit Modals -->
    <div th:each="user : ${users}">
        <div class="modal fade" th:id="'editModal__' + ${user.id}" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-lg">
                <div class="modal-content">
                    <form th:action="@{/admin/users/update}" method="post" enctype="multipart/form-data">
                        <input type="hidden" name="id" th:value="${user.id}"/>
                        <div class="modal-header">
                            <h5 class="modal-title">Chỉnh sửa người dùng</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"
                                    aria-label="Close"></button>
                        </div>
                        <div class="modal-body row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Họ tên</label>
                                <input type="text" class="form-control" name="fullName" th:value="${user.fullName}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" name="email" th:value="${user.email}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">SĐT</label>
                                <input type="text" class="form-control" name="phoneNumber" th:value="${user.phoneNumber}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Địa chỉ</label>
                                <input type="text" class="form-control" name="address" th:value="${user.address}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Avatar (ảnh mới)</label>
                                <input type="file" class="form-control" name="avatarFile">
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                            <button type="submit" class="btn btn-success">Lưu thay đổi</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
