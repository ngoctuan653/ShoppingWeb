<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Sidebar</title>
</head>
<body>
<div th:fragment="sidebar" id="sidebar" class="sidebar w-64 h-screen bg-white shadow-md overflow-y-auto">
    <div class="px-4 py-6">
        <div class="flex items-center justify-between mb-8">
            <h2 class="text-xl font-bold text-gray-800 logo-text">Dashboard</h2>
            <button id="sidebarToggle" class="text-gray-500 hover:text-gray-700 toggle-btn">
                <i class="bi bi-three-dots-vertical"></i>
            </button>
        </div>
        <nav>
            <ul class="space-y-2">
                <li>
                    <a th:href="@{/admin/dashboard}" class="flex items-center px-4 py-3 text-gray-700 rounded-lg hover:bg-gray-100">
                        <i class="bi bi-speedometer2 mr-3 text-black"></i>
                        <span class="nav-text">Overview</span>
                    </a>
                </li>
                <li>
                    <a th:href="@{/product-manage}" class="flex items-center px-4 py-3 text-gray-700 rounded-lg hover:bg-gray-100">
                        <i class="bi bi-cart3 mr-3 text-black"></i>
                        <span class="nav-text">Products</span>
                    </a>
                </li>
                <li>
                    <a th:href="@{/admin/categories}" class="flex items-center px-4 py-3 text-gray-700 rounded-lg hover:bg-gray-100">
                        <i class="bi bi-tags mr-3 text-black"></i>
                        <span class="nav-text">Categories</span>
                    </a>
                </li>
                <li>
                    <a th:href="@{/admin/users}" class="flex items-center px-4 py-3 text-gray-700 rounded-lg hover:bg-gray-100">
                        <i class="bi bi-people mr-3 text-black"></i>
                        <span class="nav-text">Users</span>
                    </a>
                </li>
                <li>
                    <a th:href="@{/order-manage}" class="flex items-center px-4 py-3 text-gray-700 rounded-lg hover:bg-gray-100">
                        <i class="bi bi-receipt mr-3 text-black"></i>
                        <span class="nav-text">Orders</span>
                    </a>
                </li>
                <li>
                    <a th:href="@{/discount-manage}" class="flex items-center px-4 py-3 text-gray-700 rounded-lg hover:bg-gray-100">
                        <i class="bi bi-percent mr-3 text-black"></i>
                        <span class="nav-text">Discounts</span>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</div>
</body>
</html>
