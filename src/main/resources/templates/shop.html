<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StyleLegacy - Fashion Website</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body>

<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top border-bottom">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="/">
            <i class="bi bi-bag-heart fs-3 me-2"></i>
            <span class="fw-bold fs-4">StyleLegacy</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mx-auto">
                <li class="nav-item"><a class="nav-link active fw-medium" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link fw-medium" href="#">Shop</a></li>
                <li class="nav-item"><a class="nav-link fw-medium" href="about">About Us</a></li>
                <li class="nav-item"><a class="nav-link fw-medium" href="contact">Contact</a></li>
            </ul>
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-outline-dark btn-sm d-none d-md-block" onclick="location.href='/login'">
                    <i class="bi bi-person me-1"></i>Sign In
                </button>
                <button class="btn btn-dark btn-sm d-none d-md-block" onclick="location.href='/signup'">Sign Up</button>
                <button class="btn btn-outline-dark btn-sm">
                    <i class="bi bi-bag"></i>
                    <span class="badge bg-danger ms-1">3</span>
                </button>
            </div>
        </div>
    </div>
</nav>

<!-- Main Content -->
<div class="container my-5">
    <div class="row">
        <!-- Sidebar with Filters -->
        <div class="col-lg-3 mb-4">
            <!-- Search Filter -->
            <div class="card mb-4">
                <div class="card-body">
                    <h5 class="card-title">Search Products</h5>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="text" class="form-control" placeholder="Search by name, brand..." id="searchInput">
                    </div>
                </div>
            </div>

            <!-- Price Filter -->
            <div class="card mb-4">
                <div class="card-body">
                    <h5 class="card-title">Price Range</h5>
                    <div class="mb-3">
                        <input type="range" class="form-range" min="0" max="500" value="200" id="priceRange">
                        <div class="d-flex justify-content-between small text-muted">
                            <span>$0</span>
                            <span>$500</span>
                        </div>
                    </div>
                    <div class="row g-2">
                        <div class="col">
                            <input type="number" class="form-control form-control-sm" placeholder="Min" id="minPrice">
                        </div>
                        <div class="col-auto align-self-center">-</div>
                        <div class="col">
                            <input type="number" class="form-control form-control-sm" placeholder="Max" id="maxPrice">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Category Filter -->
            <div class="card mb-4">
                <div class="card-body">
                    <h5 class="card-title">Categories</h5>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="t-shirts" id="cat1">
                        <label class="form-check-label" for="cat1">T-Shirts</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="dresses" id="cat2">
                        <label class="form-check-label" for="cat2">Dresses</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="jackets" id="cat3">
                        <label class="form-check-label" for="cat3">Jackets</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="shoes" id="cat4">
                        <label class="form-check-label" for="cat4">Shoes</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="shirts" id="cat5">
                        <label class="form-check-label" for="cat5">Shirts</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="accessories" id="cat6">
                        <label class="form-check-label" for="cat6">Accessories</label>
                    </div>
                </div>
            </div>

            <!-- Brand Filter -->
            <div class="card mb-4">
                <div class="card-body">
                    <h5 class="card-title">Brands</h5>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="styleco" id="brand1">
                        <label class="form-check-label" for="brand1">StyleCo</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="fashionhub" id="brand2">
                        <label class="form-check-label" for="brand2">FashionHub</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="denimco" id="brand3">
                        <label class="form-check-label" for="brand3">DenimCo</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="comfortwalk" id="brand4">
                        <label class="form-check-label" for="brand4">ComfortWalk</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="prostyle" id="brand5">
                        <label class="form-check-label" for="brand5">ProStyle</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="luxebag" id="brand6">
                        <label class="form-check-label" for="brand6">LuxeBag</label>
                    </div>
                </div>
            </div>
        </div>

        <!-- Products Grid -->
        <div class="col-lg-9">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold mb-2">Featured Products</h2>
                    <p class="text-muted">Discover our latest collection</p>
                </div>
            </div>

            <div class="row" id="productsContainer">
                <!-- Dynamically display product cards here -->
                <!-- Example product card -->
                <div class="col-md-4 mb-4">
                    <div class="card h-100">
                        <img src="https://via.placeholder.com/400x300" class="card-img-top" alt="Product Image">
                        <div class="card-body">
                            <h5 class="card-title">Slim Fit Jeans</h5>
                            <p class="card-text text-muted">High-quality slim fit jeans for a trendy look</p>
                            <p class="fw-bold">$49.99</p>
                            <a href="product-details.html?id=1" class="btn btn-dark btn-sm">Show Details</a>
                        </div>
                    </div>
                </div>
                <!-- More products will be displayed here dynamically -->
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<footer class="bg-light border-top mt-5">
    <div class="container py-5">
        <!-- footer content here -->
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Example: Implementing product filter functionality using JavaScript
    document.getElementById('searchInput').addEventListener('input', function() {
        var searchValue = this.value.toLowerCase();
        filterProducts();
    });

    document.getElementById('priceRange').addEventListener('input', function() {
        var priceValue = this.value;
        document.getElementById('minPrice').value = priceValue;
        filterProducts();
    });

    document.getElementById('minPrice').addEventListener('input', function() {
        filterProducts();
    });

    document.getElementById('maxPrice').addEventListener('input', function() {
        filterProducts();
    });

    // Filter products based on user input
    function filterProducts() {
        var searchValue = document.getElementById('searchInput').value.toLowerCase();
        var minPrice = parseFloat(document.getElementById('minPrice').value) || 0;
        var maxPrice = parseFloat(document.getElementById('maxPrice').value) || 500;
        
        // Filter logic here: you can make a backend request or filter products on the front-end
        // Example: Get all products and loop through them, check if they match the filter conditions
        var products = document.querySelectorAll('.card');
        products.forEach(function(product) {
            var productName = product.querySelector('.card-title').textContent.toLowerCase();
            var productPrice = parseFloat(product.querySelector('.fw-bold').textContent.replace('$', '').trim());

            // Apply filters
            if (
                (productName.includes(searchValue)) &&
                (productPrice >= minPrice && productPrice <= maxPrice)
            ) {
                product.style.display = 'block'; // Show product
            } else {
                product.style.display = 'none'; // Hide product
            }
        });
    }
</script>

</body>
</html>
