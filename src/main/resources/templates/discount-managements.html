<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Discount Code Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light" style="padding-top: 80px;">

<!-- Navbar -->
<div th:replace="fragments/admin-header-navbar :: navbar"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-0">Discount Management</h2>
            <p class="text-muted">Manage your store's discounts</p>
        </div>
        <button class="btn btn-dark" data-bs-toggle="modal" data-bs-target="#addDiscountModal">
            <i class="bi bi-plus-circle"></i> Add Discount
        </button>
    </div>

    <!-- Discount Codes Table -->
    <div class="table-responsive">
        <table class="table table-bordered table-hover bg-white shadow-sm">
            <thead class="table-dark">
            <tr>
                <th>#</th>
                <th>Code</th>
                <th>Discount (%)</th>
                <th>Description</th>
                <th>Start Date</th>
                <th>End Date</th>
                <!--                <th>Status</th>-->
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <!-- Sample row -->
            <tr th:each="discount : ${discounts}">
                <td th:text="${discount.id}">1</td>
                <td th:text="${discount.code}">WELCOME20</td>
                <td th:text="${discount.discountPercentage}">20%</td>
                <td th:text="${discount.description}">20%</td>
                <td th:text="${#dates.format(discount.startDate, 'dd/MM/yyyy ''at'' HH:mm')}"></td>
                <td th:text="${#dates.format(discount.endDate, 'dd/MM/yyyy ''at'' HH:mm')}"></td>
                <!--                <td><span class="badge bg-success">Active</span></td>-->
                <td>
                    <button class="btn btn-sm btn-warning me-2" data-bs-toggle="modal"
                            data-bs-target="#editDiscountModal"><i class="bi bi-pencil-square"></i></button>
                    <button class="btn btn-sm btn-danger"><i class="bi bi-trash"></i></button>
                </td>
            </tr>
            <!-- More rows here -->
            </tbody>
        </table>
    </div>
</div>

<!-- Add Discount Modal -->
<div class="modal fade" id="addDiscountModal" tabindex="-1" aria-labelledby="addDiscountModalLabel"
     aria-hidden="true">
    <div class="modal-dialog">
        <form class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add Discount Code</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label for="code" class="form-label">Code</label>
                    <input type="text" class="form-control" id="code" required>
                </div>
                <div class="mb-3">
                    <label for="percentage" class="form-label">Discount Percentage</label>
                    <input type="number" class="form-control" id="percentage" min="1" max="100" required>
                </div>
                <div class="mb-3">
                    <label for="description" class="form-label">Description</label>
                    <input type="text" class="form-control" id="description" required>
                </div>
                <div class="mb-3">
                    <label for="startDate" class="form-label">Start Date</label>
                    <input type="date" class="form-control" id="startDate" required>
                </div>
                <div class="mb-3">
                    <label for="endDate" class="form-label">End Date</label>
                    <input type="date" class="form-control" id="endDate" required>
                </div>

            </div>
            <div class="modal-footer">
                <button type="submit" class="btn btn-primary">Add Discount</button>
            </div>
        </form>
    </div>
</div>

<!-- Edit Discount Modal -->
<div class="modal fade" id="editDiscountModal" tabindex="-1" aria-labelledby="editDiscountModalLabel"
     aria-hidden="true">
    <div class="modal-dialog">
        <form class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Edit Discount Code</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label for="editCode" class="form-label">Code</label>
                    <input type="text" class="form-control" id="editCode" value="WELCOME20" required>
                </div>
                <div class="mb-3">
                    <label for="editPercentage" class="form-label">Discount Percentage</label>
                    <input type="number" class="form-control" id="editPercentage" value="20" min="1" max="100"
                           required>
                </div>
                <div class="mb-3">
                    <label for="editExpiry" class="form-label">Expiration Date</label>
                    <input type="date" class="form-control" id="editExpiry" value="2025-12-31" required>
                </div>
                <div class="mb-3">
                    <label for="editStatus" class="form-label">Status</label>
                    <select class="form-select" id="editStatus">
                        <option value="active" selected>Active</option>
                        <option value="inactive">Inactive</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="submit" class="btn btn-warning">Update Discount</button>
            </div>
        </form>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
