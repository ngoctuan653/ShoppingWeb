<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Discount Code Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light" style="padding-top: 80px;">

<!-- Navbar -->
<div th:replace="fragments/admin-header-navbar :: navbar"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-0">Discount Management</h2>
            <p class="text-muted">Manage your store's discounts</p>
        </div>
        <button class="btn btn-dark" data-bs-toggle="modal" data-bs-target="#addDiscountModal">
            <i class="bi bi-plus-circle"></i> Add Discount
        </button>
    </div>

    <!-- Discount Codes Table -->
    <div class="table-responsive">
        <table class="table table-bordered table-hover bg-white shadow-sm">
            <thead class="table-dark">
            <tr>
                <th>#</th>
                <th>Code</th>
                <th>Discount (%)</th>
                <th>Description</th>
                <th>Start Date</th>
                <th>End Date</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="discountTableBody">
            <!-- Data will be loaded via AJAX -->
            </tbody>
        </table>
    </div>
</div>

<!-- Add Discount Modal -->
<div class="modal fade" id="addDiscountModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <form class="modal-content" id="addDiscountForm">
            <div class="modal-header">
                <h5 class="modal-title">Add Discount Code</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label for="code" class="form-label">Code <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="code" name="code" placeholder="e.g., WELCOME20" required>
                    <div class="form-text">Code will be automatically converted to uppercase</div>
                </div>
                <div class="mb-3">
                    <label for="percentage" class="form-label">Discount Percentage <span class="text-danger">*</span></label>
                    <input type="number" class="form-control" id="percentage" name="percentage" min="1" max="100" placeholder="e.g., 20" required>
                    <div class="form-text">Enter a value between 1 and 100</div>
                </div>
                <div class="mb-3">
                    <label for="description" class="form-label">Description <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="description" name="description" placeholder="e.g., Welcome discount for new customers" required>
                </div>
                <div class="mb-3">
                    <label for="startDate" class="form-label">Start Date <span class="text-danger">*</span></label>
                    <input type="date" class="form-control" id="startDate" name="startDate" required>
                </div>
                <div class="mb-3">
                    <label for="endDate" class="form-label">End Date <span class="text-danger">*</span></label>
                    <input type="date" class="form-control" id="endDate" name="endDate" required>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-plus-circle"></i> Add Discount
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Edit Discount Modal -->
<div class="modal fade" id="editDiscountModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <form class="modal-content" id="editDiscountForm">
            <div class="modal-header">
                <h5 class="modal-title">Edit Discount Code</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editId" name="id">
                <div class="mb-3">
                    <label for="editCode" class="form-label">Code <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="editCode" name="code" required>
                </div>
                <div class="mb-3">
                    <label for="editPercentage" class="form-label">Discount Percentage <span class="text-danger">*</span></label>
                    <input type="number" class="form-control" id="editPercentage" name="percentage" min="1" max="100" required>
                </div>
                <div class="mb-3">
                    <label for="editDescription" class="form-label">Description <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="editDescription" name="description" required>
                </div>
                <div class="mb-3">
                    <label for="editStartDate" class="form-label">Start Date <span class="text-danger">*</span></label>
                    <input type="date" class="form-control" id="editStartDate" name="startDate" required>
                </div>
                <div class="mb-3">
                    <label for="editEndDate" class="form-label">End Date <span class="text-danger">*</span></label>
                    <input type="date" class="form-control" id="editEndDate" name="endDate" required>
                </div>
                <div class="mb-3">
                    <label for="editStatus" class="form-label">Status <span class="text-danger">*</span></label>
                    <select class="form-select" id="editStatus" name="status" required>
                        <option value="Active">Active</option>
                        <option value="Inactive">Inactive</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-warning">
                    <i class="bi bi-pencil-square"></i> Update Discount
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const today = new Date().toISOString().split('T')[0];

        // Set minimum dates
        document.getElementById('startDate').setAttribute('min', today);
        document.getElementById('endDate').setAttribute('min', today);

        // Load discounts on page load
        loadDiscounts();

        // Handle date validation
        setupDateValidation();

        // Handle form submissions
        setupFormHandlers();
    });

    // Load all discounts
    function loadDiscounts() {
        fetch('/api/discounts/all')
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    showAlert('error', data.error);
                    return;
                }
                renderDiscountsTable(data);
            })
            .catch(error => {
                console.error('Error:', error);
                showAlert('error', 'Failed to load discounts');
            });
    }

    // Render discounts table
    function renderDiscountsTable(discounts) {
        const tbody = document.getElementById('discountTableBody');
        tbody.innerHTML = '';

        discounts.forEach(discount => {
            const row = `
            <tr>
                <td>${discount.id}</td>
                <td>${discount.code}</td>
                <td>${discount.discountPercentage}%</td>
                <td>${discount.description}</td>
                <td>${formatDate(discount.startDate)}</td>
                <td>${formatDate(discount.endDate)}</td>
                <td><span class="badge ${discount.status === 'Active' ? 'bg-success' : 'bg-secondary'}">${discount.status}</span></td>
                <td>
                    <button class="btn btn-sm btn-warning me-2" onclick="editDiscount(${discount.id})">
                        <i class="bi bi-pencil-square"></i>
                    </button>
                    <button class="btn btn-sm btn-danger" onclick="deleteDiscount(${discount.id})">
                        <i class="bi bi-trash"></i>
                    </button>
                </td>
            </tr>
        `;
            tbody.innerHTML += row;
        });
    }

    // Format date for display
    function formatDate(dateString) {
        const date = new Date(dateString);
        return date.toLocaleDateString('en-GB') + ' at ' + date.toLocaleTimeString('en-GB', {hour: '2-digit', minute: '2-digit'});
    }

    // Setup date validation
    function setupDateValidation() {
        const startDate = document.getElementById('startDate');
        const endDate = document.getElementById('endDate');
        const editStartDate = document.getElementById('editStartDate');
        const editEndDate = document.getElementById('editEndDate');

        startDate.addEventListener('change', function() {
            endDate.setAttribute('min', this.value);
            if (endDate.value && endDate.value < this.value) {
                endDate.value = this.value;
            }
        });

        editStartDate.addEventListener('change', function() {
            editEndDate.setAttribute('min', this.value);
            if (editEndDate.value && editEndDate.value < this.value) {
                editEndDate.value = this.value;
            }
        });
    }

    // Setup form handlers
    function setupFormHandlers() {
        // Add form handler
        document.getElementById('addDiscountForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const formData = new FormData(this);
            const data = {
                code: formData.get('code'),
                percentage: formData.get('percentage'),
                description: formData.get('description'),
                startDate: formData.get('startDate'),
                endDate: formData.get('endDate')
            };

            // Validate dates
            if (new Date(data.endDate) <= new Date(data.startDate)) {
                showAlert('error', 'End date must be after start date!');
                return;
            }

            fetch('/api/discounts/add', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            })
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        showAlert('error', data.error);
                    } else {
                        showAlert('success', 'Discount added successfully!');
                        bootstrap.Modal.getInstance(document.getElementById('addDiscountModal')).hide();
                        this.reset();
                        loadDiscounts();
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    showAlert('error', 'Failed to add discount');
                });
        });

        // Edit form handler
        document.getElementById('editDiscountForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const formData = new FormData(this);
            const data = {
                id: formData.get('id'),
                code: formData.get('code'),
                percentage: formData.get('percentage'),
                description: formData.get('description'),
                startDate: formData.get('startDate'),
                endDate: formData.get('endDate'),
                status: formData.get('status')
            };

            // Validate dates
            if (new Date(data.endDate) <= new Date(data.startDate)) {
                showAlert('error', 'End date must be after start date!');
                return;
            }

            fetch('/api/discounts/edit', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            })
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        showAlert('error', data.error);
                    } else {
                        showAlert('success', 'Discount updated successfully!');
                        bootstrap.Modal.getInstance(document.getElementById('editDiscountModal')).hide();
                        loadDiscounts();
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    showAlert('error', 'Failed to update discount');
                });
        });
    }

    // Edit discount
    function editDiscount(id) {
        fetch(`/api/discounts/${id}`)
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    showAlert('error', data.error);
                    return;
                }

                // Populate edit form
                document.getElementById('editId').value = data.id;
                document.getElementById('editCode').value = data.code;
                document.getElementById('editPercentage').value = data.percentage;
                document.getElementById('editDescription').value = data.description;
                document.getElementById('editStartDate').value = data.startDate;
                document.getElementById('editEndDate').value = data.endDate;
                document.getElementById('editStatus').value = data.status;

                // Update minimum date for edit end date
                document.getElementById('editEndDate').setAttribute('min', data.startDate);

                // Show modal
                new bootstrap.Modal(document.getElementById('editDiscountModal')).show();
            })
            .catch(error => {
                console.error('Error:', error);
                showAlert('error', 'Failed to load discount data');
            });
    }

    // Delete discount
    function deleteDiscount(id) {
        Swal.fire({
            title: 'Are you sure?',
            text: "You won't be able to revert this!",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#d33',
            cancelButtonColor: '#3085d6',
            confirmButtonText: 'Yes, delete it!'
        }).then((result) => {
            if (result.isConfirmed) {
                fetch(`/api/discounts/${id}`, {
                    method: 'DELETE'
                })
                    .then(response => response.json())
                    .then(data => {
                        if (data.error) {
                            showAlert('error', data.error);
                        } else {
                            showAlert('success', 'Discount deleted successfully!');
                            loadDiscounts();
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        showAlert('error', 'Failed to delete discount');
                    });
            }
        });
    }

    // Show alert using SweetAlert2
    function showAlert(type, message) {
        Swal.fire({
            icon: type,
            title: message,
            showConfirmButton: false,
            timer: 3000,
            toast: true,
            position: 'top'
        });
    }
</script>

</body>
</html>
