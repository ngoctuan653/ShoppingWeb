<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Store Statistics</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      background-color: #f8f9fa;
      padding-top: 80px;
    }

    .stats-card {
      border-radius: 1rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      transition: transform 0.3s ease;
    }

    .stats-card:hover {
      transform: translateY(-3px);
    }

    .stats-icon {
      font-size: 2rem;
      color: #0d6efd;
    }

    .chart-card {
      border-radius: 1rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      padding: 1rem;
    }
  </style>
</head>
<body>

<!-- Admin Header Navbar (fragment) -->
<div th:replace="fragments/admin-header-navbar :: navbar"></div>

<div class="container">
  <h2 class="fw-bold mb-4 text-center">Store Statistics</h2>

  <!-- Statistics Cards -->
  <div class="row g-4">
    <div class="col-md-4">
      <div class="bg-white p-4 stats-card text-center">
        <i class="bi bi-currency-dollar stats-icon mb-2"></i>
        <h5>Total Sales</h5>
        <p class="fs-4 fw-bold text-success">$15,450</p>
      </div>
    </div>

    <div class="col-md-4">
      <div class="bg-white p-4 stats-card text-center">
        <i class="bi bi-box stats-icon mb-2"></i>
        <h5>Products in Store</h5>
        <p class="fs-4 fw-bold text-primary">120</p>
      </div>
    </div>

    <div class="col-md-4">
      <div class="bg-white p-4 stats-card text-center">
        <i class="bi bi-people stats-icon mb-2"></i>
        <h5>Total Customers</h5>
        <p class="fs-4 fw-bold text-info">380</p>
      </div>
    </div>
  </div>

  <!-- Sales Chart -->
  <div class="row mt-5">
    <div class="col-12">
      <div class="bg-white chart-card">
        <h5 class="mb-3">Weekly Revenue</h5>
        <canvas id="revenueChart" height="100"></canvas>
      </div>
    </div>
  </div>
</div>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  const ctx = document.getElementById('revenueChart');
  new Chart(ctx, {
    type: 'line',
    data: {
      labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
      datasets: [{
        label: 'Sales ($)',
        data: [800, 950, 1100, 870, 1250, 1400, 1600],
        borderColor: '#0d6efd',
        backgroundColor: 'rgba(13,110,253,0.2)',
        tension: 0.4,
        fill: true
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: {
          display: false
        }
      }
    }
  });
</script>

<!-- Bootstrap JS (with Popper) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
