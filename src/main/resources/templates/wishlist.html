<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist | StyleLegacy</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/wishlist-styles.css">

</head>
<body>
<!-- Navigation Bar -->
<div th:replace="fragments/header-navbar :: navbar"></div>

<!-- Hero Section -->
<section class="hero-wishlist d-flex align-items-center">
    <div class="container position-relative z-2">
        <div class="row align-items-center">
            <div class="col-lg-8 mx-auto text-center text-white">
                <h1 class="display-4 fw-bold mb-3">
                    <i class="fas fa-heart me-3 text-pink"></i>Wishlist
                </h1>
                <p class="lead mb-0 opacity-75">
                    Your collection of favorite items, saved for later
                </p>
            </div>
        </div>
    </div>
</section>

<!-- Main Content -->
<div class="container my-5">
    <!-- Wishlist Header Card -->
    <div class="card wishlist-header shadow-lg border-0 mb-5">
        <div class="card-body p-4">
            <div class="row align-items-center">
                <div class="col-md-8">
                    <div class="d-flex align-items-center">
                        <div class="stats-card rounded-circle p-3 me-3" style="width: 60px; height: 60px;">
                            <i class="fas fa-heart text-danger fs-4"></i>
                        </div>
                        <div>
                            <h4 class="mb-1 fw-bold">Saved Items</h4>
                            <p class="text-muted mb-0" th:text="|${#lists.size(wishlistItems)} items in your wishlist|">0 items in your wishlist</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 text-md-end mt-3 mt-md-0">
                    <div class="d-flex flex-column flex-md-row gap-2 align-items-md-center justify-content-md-end">
                        <select class="form-select form-select-sm" style="max-width: 200px;">
                            <option>Sort by: Recently Added</option>
                            <option>Sort by: Price Low to High</option>
                            <option>Sort by: Price High to Low</option>
                            <option>Sort by: Name A-Z</option>
                        </select>
                        <form th:action="@{/wishlist/move-all-to-cart}" method="post" th:unless="${#lists.isEmpty(wishlistItems)}">
                            <button type="submit" class="btn btn-success btn-sm">
                                <i class="fas fa-shopping-cart me-1"></i>Move All to Cart
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Wishlist Content -->
    <div class="row">
        <!-- Empty Wishlist State -->
        <div class="col-12" th:if="${#lists.isEmpty(wishlistItems)}">
            <div class="empty-state d-flex align-items-center justify-content-center position-relative">
                <div class="text-center position-relative z-2 p-5">
                    <div class="mb-4">
                        <i class="fas fa-heart-broken text-muted" style="font-size: 5rem; opacity: 0.3;"></i>
                    </div>
                    <h3 class="fw-bold text-muted mb-3">Your wishlist is empty</h3>
                    <p class="text-muted mb-4 lead">
                        Discover amazing products and save your favorites here
                    </p>
                    <a th:href="@{/shop}" class="btn btn-dark btn-lg px-4">
                        <i class="fas fa-shopping-bag me-2"></i>Start Shopping
                    </a>
                </div>
            </div>
        </div>

        <!-- Wishlist Items Grid -->
        <div th:unless="${#lists.isEmpty(wishlistItems)}">
            <div class="row g-4">
                <div class="col-lg-3 col-md-4 col-sm-6" th:each="item : ${wishlistItems}">
                    <div class="card product-card h-100 position-relative fade-in">
                        <!-- Product Actions -->
                        <div class="product-actions">
                            <form th:action="@{/wishlist/remove}" method="post">
                                <input type="hidden" name="productId" th:value="${item.product.id}">
                                <button type="submit" class="action-btn remove" title="Remove from wishlist">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </form>
                            <form th:action="@{/wishlist/move-to-cart/{productId}(productId=${item.product.id})}" method="post">
                                <button type="submit" class="action-btn cart" title="Move to cart">
                                    <i class="fas fa-shopping-cart"></i>
                                </button>
                            </form>
                        </div>

                        <!-- Product Link -->
                        <a th:href="@{'/products/' + ${item.product.id}}" class="text-decoration-none text-dark">
                            <img th:if="${item.product.image != null}"
                                 th:src="@{'/products/image/' + ${item.product.id}}"
                                 class="card-img-top"
                                 alt="Product Image"
                                 style="height: 350px; object-fit: cover;">
                            <img th:if="${item.product.image == null}"
                                 th:src="@{/images/default.png}"
                                 class="card-img-top"
                                 alt="Default Product Image"
                                 style="height: 350px; object-fit: cover;">
                        </a>

                        <div class="card-body d-flex flex-column">
                            <a th:href="@{'/products/' + ${item.product.id}}" class="text-decoration-none text-dark">
                                <h5 class="card-title mb-2" th:text="${item.product.productName}">Product Name</h5>
                            </a>
                            <p class="card-text text-muted small mb-2" th:text="${item.product.subcategory?.subcategoryName}">Subcategory</p>
                            <p class="card-text text-muted small mb-2" th:text="${item.product.category?.categoryName}">Category</p>
                            <div class="mt-auto">
                                <p class="fw-bold mb-0 fs-5" th:text="'$' + ${item.product.price}">$0.00</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Bottom Actions -->
            <div class="row mt-5">
                <div class="col-12">
                    <div class="card border-0 bg-light">
                        <div class="card-body text-center p-4">
                            <h5 class="mb-3">Ready to make a purchase?</h5>
                            <div class="d-flex flex-column flex-sm-row gap-3 justify-content-center">
                                <form th:action="@{/wishlist/move-all-to-cart}" method="post">
                                    <button type="submit" class="btn btn-success btn-lg px-4">
                                        <i class="fas fa-shopping-cart me-2"></i>Move All to Cart
                                    </button>
                                </form>
                                <a th:href="@{/shop}" class="btn btn-outline-dark btn-lg px-4">
                                    <i class="fas fa-plus me-2"></i>Continue Shopping
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<div th:replace="fragments/footer :: footer"></div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Add smooth animations on page load
    document.addEventListener('DOMContentLoaded', function() {
        const cards = document.querySelectorAll('.product-card');
        cards.forEach((card, index) => {
            card.style.animationDelay = `${index * 0.1}s`;
        });
    });

    // Confirm before removing items
    document.querySelectorAll('.action-btn.remove').forEach(btn => {
        btn.addEventListener('click', function(e) {
            if (!confirm('Are you sure you want to remove this item from your wishlist?')) {
                e.preventDefault();
            }
        });
    });

    // Confirm before moving all items
    document.querySelectorAll('form[action*="move-all-to-cart"] button').forEach(btn => {
        btn.addEventListener('click', function(e) {
            if (!confirm('Move all items to your cart?')) {
                e.preventDefault();
            }
        });
    });
</script>
</body>
</html>
