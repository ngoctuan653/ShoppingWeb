<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${product.productName} + ' - StyleLegacy'">Product Detail</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .product-image {
            width: 100%;
            object-fit: contain;
            border-radius: 16px;
            background: #f8f9fa;
            max-height: 600px;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
        }

        .price-tag {
            font-size: 1.75rem;
            font-weight: 700;
            color: #000;
        }

        .product-detail-container {
            margin-top: 4rem;
            margin-bottom: 4rem;
        }

        @media (max-width: 768px) {
            .product-detail-container {
                margin-top: 2rem;
                margin-bottom: 2rem;
            }
        }
    </style>
</head>
<body>

<!-- Navbar -->
<div th:replace="fragments/header-navbar :: navbar"></div>

<!-- Product Detail -->
<div class="container product-detail-container">
    <div class="row align-items-center g-5">
        <!-- Image Section -->
        <div class="col-lg-6 col-md-12">
            <img th:src="@{'/products/image/' + ${product.id}}"
                 alt="Product Image"
                 class="img-fluid product-image shadow-sm">
        </div>

        <!-- Info Section -->
        <div class="col-lg-6 col-md-12">
            <h1 class="display-6 fw-bold mb-3" th:text="${product.productName}">Product Name</h1>
            <p class="text-muted mb-2" th:text="'Category: ' + ${product.category.getCategoryName()}">Category</p>
            <p class="mb-4 fs-5" th:text="${product.description}">Product description</p>
            <div class="price-tag mb-4" th:text="'$' + ${product.price}">$0.00</div>

            <div class="d-grid gap-3 d-md-flex">
                <button class="btn btn-dark btn-lg" th:attr="data-id=${product.id}" id="addToCartBtn">

                <i class="bi bi-cart-plus me-2"></i>Add to Cart
                </button>
                <a href="/index" class="btn btn-outline-secondary btn-lg">Back to Shop</a>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<div th:replace="fragments/footer :: footer"></div>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('addToCartBtn').addEventListener('click', function () {
        const productId = this.dataset.id;

        fetch('/cart/add/' + productId, {
            method: 'POST',
            headers: {
                'X-Requested-With': 'XMLHttpRequest'
            }
        })
            .then(response => {
                if (response.status === 200) {
                    alert("Sản phẩm đã được thêm vào giỏ hàng!");
                } else if (response.status === 401) {
                    alert("Bạn cần đăng nhập trước khi thêm vào giỏ hàng.");
                    window.location.href = "/login"; // chuyển hướng nếu chưa login
                } else {
                    alert("Có lỗi xảy ra khi thêm vào giỏ hàng.");
                }
            })
            .catch(error => {
                console.error("Lỗi khi gọi API:", error);
                alert("Không thể thêm vào giỏ hàng.");
            });
    });
</script>
<script src="/js/script.js"></script>
<div th:replace="fragments/cart :: cart"></div>
</body>
</html>
