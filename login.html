<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
      * {
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: #e74c3c;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .login-box {
        background-color: #fff;
        width: 360px;
        border-radius: 8px;
        box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
        overflow: hidden;
      }

      .login-header {
        background-color: #fff;
        color: rgb(0, 0, 0);
        padding: 20px;
        text-align: center;
        font-size: 24px;
        font-weight: 600;
      }

      .login-body {
        padding: 30px;
      }

      .input-group {
        display: flex;
        align-items: center;
        margin-bottom: 20px;
        border: 1px solid #ccc;
        border-radius: 5px;
        overflow: hidden;
      }

      .input-group span {
        background-color: #c0392b;
        color: #fff;
        padding: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .input-group input {
        border: none;
        padding: 10px;
        flex: 1;
        outline: none;
      }

      .forgot {
        display: block;
        margin-bottom: 20px;
        color: rgb(0, 128, 255);
        text-decoration: none;
        font-size: 14px;
      }

      .login-button {
        background-color: #e74c3c;
        border: none;
        color: #fff;
        width: 100%;
        padding: 12px;
        border-radius: 5px;
        font-size: 18px;
        cursor: pointer;
        transition: 0.3s;
      }

      .login-button:hover {
        background-color: rgb(255, 128, 128);
      }

      .signup-link {
        text-align: center;
        margin-top: 20px;
        font-size: 14px;
      }

      .signup-link a {
        color: #e74c3c;
        text-decoration: none;
      }
    </style>
</head>
<body>
  <div class="login-box">
    <div class="login-header">Login</div>
    <form class="login-body" action="/login" method="post">
      <div class="input-group">
        <input type="text" name="username" placeholder="Email or Phone" required>
      </div>
      <div class="input-group">
        <input type="password" name="password" placeholder="Password" required>
      </div>
      <a class="forgot" href="#">Forgot password?</a>
      <button type="submit" class="login-button">Login</button>
      <div class="signup-link">
        Don't have an account? <a href="/signup">Sign up</a>
      </div>
    </form>
  </div>
</body>
</html>
