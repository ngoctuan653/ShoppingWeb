<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - StyleLegacy</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">
	
	<!-- Navigation Bar -->
	    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top border-bottom">
	        <div class="container">
	            <!-- Logo -->
	            <a class="navbar-brand d-flex align-items-center" href="#">
	                <i class="bi bi-bag-heart fs-3 me-2"></i>
	                <span class="fw-bold fs-4">StyleLegacy</span>
	            </a>

	            <!-- Mobile Toggle -->
	            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
	                <span class="navbar-toggler-icon"></span>
	            </button>

	            <!-- Navigation Links -->
	            <div class="collapse navbar-collapse" id="navbarNav">
	                <ul class="navbar-nav mx-auto">
	                    <li class="nav-item">
	                        <a class="nav-link active fw-medium" href="/index">Home</a>
	                    </li>
	                    <li class="nav-item">
	                        <a class="nav-link fw-medium" href="#">Shop</a>
	                    </li>
	                    <li class="nav-item">
	                        <a class="nav-link fw-medium" href="#">About Us</a>
	                    </li>
	                    <li class="nav-item">
	                        <a class="nav-link fw-medium" href="#">Contact</a>
	                    </li>
	                </ul>

	                <!-- Right Side Actions -->
	                <div class="d-flex align-items-center gap-2">
	                    <button class="btn btn-outline-dark btn-sm d-none d-md-block" onclick="location.href='/login'">
	                        <i class="bi bi-person me-1"></i>Sign In
	                    </button>
	                    <button class="btn btn-dark btn-sm d-none d-md-block" onclick="location.href='/signup'">Sign Up</button>
	                    <button class="btn btn-outline-dark btn-sm">
	                        <i class="bi bi-bag"></i>
	                        <span class="badge bg-danger ms-1">3</span>
	                    </button>
	                </div>
	            </div>
	        </div>
	    </nav>

  <div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="card shadow p-4" style="max-width: 400px; width: 100%;">
      <div class="text-center mb-4">
        <i class="bi bi-bag-heart fs-1"></i>
        <h2 class="fw-bold">Welcome Back</h2>
        <p class="text-muted">Sign in to your account</p>
      </div>
      <form action="/login" method="post">
        <div class="mb-3">
          <label for="email" class="form-label">Email address</label>
          <input type="email" class="form-control" id="email" name="username" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label d-flex justify-content-between">
            Password
            <a href="#" class="small text-muted">Forgot?</a>
          </label>
          <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-dark w-100">Sign In</button>
      </form>
      <div class="text-center mt-3">
        <span class="text-muted">Don't have an account?</span>
        <a href="/signup" class="fw-medium">Sign Up</a>
      </div>
    </div>
  </div>

</body>
</html>
