<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - StyleLegacy</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">

  <div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="card shadow p-4" style="max-width: 400px; width: 100%;">
      <div class="text-center mb-4">
        <i class="bi bi-bag-heart fs-1"></i>
        <h2 class="fw-bold">Welcome Back</h2>
        <p class="text-muted">Sign in to your account</p>
      </div>
      <form action="/login" method="post">
        <div class="mb-3">
          <label for="email" class="form-label">Email address</label>
          <input type="email" class="form-control" id="email" name="username" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label d-flex justify-content-between">
            Password
            <a href="#" class="small text-muted">Forgot?</a>
          </label>
          <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-dark w-100">Sign In</button>
      </form>
      <div class="text-center mt-3">
        <span class="text-muted">Don't have an account?</span>
        <a href="/signup" class="fw-medium">Sign Up</a>
      </div>
    </div>
  </div>

</body>
</html>
